<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Wing-O Gift Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&family=Playfair+Display:wght@900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  body{background:#F4EBD7;color:#1A1208;font-family:Arial,sans-serif;padding:20px 16px 40px;}
  .wrap{max-width:440px;margin:0 auto;text-align:center;}
  .logo{height:46px;margin:6px 0 14px;}
:root{--r:#E8190A;}
  /* The gift card: a real wings photo, ribbon and bow, gold stamp, snow */
  .gc-wrap{margin:26px 0 18px;max-width:470px;perspective:900px;}
  .gc{position:relative;aspect-ratio:1.6;border-radius:18px;overflow:hidden;border:3px solid #1A1208;transform:rotate(-2.5deg);transition:transform .4s ease;
    background:#120a05 url(/images/email-wings-wide.jpg) 78% 45%/cover no-repeat;box-shadow:0 22px 40px rgba(26,18,8,.35),12px 12px 0 var(--r);}
  .gc:hover{transform:rotate(0deg) scale(1.02);}
  .gc::before{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(14,7,3,.97) 0%,rgba(14,7,3,.86) 38%,rgba(14,7,3,.25) 66%,rgba(14,7,3,0) 80%);}
  .gc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:radial-gradient(circle,#fff 0 1.4px,transparent 1.6px),radial-gradient(circle,#fff 0 1px,transparent 1.2px);background-size:46px 46px,29px 29px;background-position:7px 11px,19px 3px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%);mask-image:linear-gradient(180deg,#000 0%,transparent 70%);}
  .gc .rib-v{position:absolute;top:0;bottom:0;right:24%;width:9%;background:linear-gradient(90deg,#A8120A,#E8190A 30%,#FF4A2E 50%,#E8190A 70%,#A8120A);box-shadow:0 0 10px rgba(0,0,0,.35);z-index:1;}
  .gc .rib-h{position:absolute;left:0;right:0;top:20%;height:11%;background:linear-gradient(180deg,#A8120A,#E8190A 30%,#FF4A2E 50%,#E8190A 70%,#A8120A);box-shadow:0 0 10px rgba(0,0,0,.35);z-index:1;}
  .gc .bow{position:absolute;right:calc(24% + 4.5% - 58px);top:calc(25.5% - 44px);width:116px;z-index:3;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45));}
  .gc .badge{position:absolute;left:5%;top:7%;z-index:2;background:#F4EBD7;border-radius:10px;padding:7px 12px;box-shadow:0 3px 0 #1A1208;}
  .gc .badge img{height:30px;display:block;}
  .gc .stamp{position:absolute;left:46%;top:41%;z-index:2;width:76px;height:76px;border-radius:50%;border:2px dashed #F5C044;color:#F5C044;
    display:flex;align-items:center;justify-content:center;text-align:center;font:700 10px/1.15 Oswald;letter-spacing:1.5px;transform:rotate(-14deg);background:rgba(14,7,3,.55);}
  .gc .face{position:absolute;left:5%;bottom:8%;z-index:2;color:#F4EBD7;}
  .gc .amt{font-family:"Bebas Neue";font-size:86px;line-height:.82;color:#FFF6E2;text-shadow:4px 4px 0 var(--r);}
  .gc .lbl{font:700 13px Oswald;letter-spacing:4px;color:#F5C044;margin-top:8px;}
  .gc .sub{font:13px "Special Elite",monospace;color:#E9DCC1;margin-top:4px;}
  .gc .ribbon{display:inline-block;margin-bottom:10px;background:#F5C044;color:#1A1208;font:700 12px Oswald;letter-spacing:2px;padding:4px 10px;border-radius:4px;box-shadow:0 3px 0 #1A1208;transform:rotate(-2deg);}
  .gc .ribbon:empty{display:none;}
  @media (max-width:520px){ .gc .amt{font-size:60px;} .gc .lbl{font-size:11px;letter-spacing:3px;} .gc .sub{font-size:11px;} .gc .ribbon{font-size:10px;margin-bottom:6px;} .gc .bow{width:90px;right:calc(24% + 4.5% - 45px);top:calc(25.5% - 34px);} .gc .stamp{width:60px;height:60px;font-size:8px;} .gc .badge img{height:24px;} }
  .gc .ribbon:empty{display:none;}
  .panel{background:#fff;border:3px solid #1A1208;padding:18px;margin:0 0 20px;text-align:center;}
  .code{font:700 20px "Courier New",monospace;letter-spacing:2px;margin:12px 0;}
  #qr{display:inline-block;padding:10px;background:#fff;margin-top:6px;}
  #qr img,#qr canvas{display:block;width:220px;height:220px;}
  .bal{font-size:18px;margin:6px 0;}
  .bal b{font-size:26px;font-family:"Playfair Display";}
  .note{font-size:14px;line-height:1.55;color:#4A3B28;margin-top:10px;}
  .err{color:#C41408;font-weight:700;}
  a.btn{display:inline-block;margin-top:16px;background:#E8190A;color:#fff;text-decoration:none;font:700 16px Oswald;letter-spacing:2px;padding:12px 24px;box-shadow:0 4px 0 #A8120A;}
  .from{font-family:"Special Elite",monospace;margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/images/wingo-logo-wide.png" alt="Wing-O">
  <div id="out"><p>Loading your card…</p></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function esc(s){ var d=document.createElement('div'); d.textContent = s==null ? '' : String(s); return d.innerHTML; }
function money(c){ return '$' + (c/100).toFixed(2); }
var code = new URLSearchParams(location.search).get('c') || '';
fetch('/api/giftcards/balance', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code: code }) })
  .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error); return d; }); })
  .then(function(d){
    var c = d.card;
    document.getElementById('out').innerHTML =
      (c.from && c.kind === 'purchased' ? '<div class="from">From ' + esc(c.from) + '</div>' : '') +
      '<div class="gc-wrap" style="margin:8px auto 30px;"><div class="gc"><div class="rib-v"></div><div class="rib-h"></div><svg class="bow" viewBox="0 0 120 90" aria-hidden="true"><defs><linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4A2E"/><stop offset=".55" stop-color="#E8190A"/><stop offset="1" stop-color="#9E1008"/></linearGradient></defs><path d="M60 46 C40 8 6 6 8 30 C10 52 42 52 60 46Z" fill="url(#bw)" stroke="#7A0C06" stroke-width="2"/><path d="M60 46 C80 8 114 6 112 30 C110 52 78 52 60 46Z" fill="url(#bw)" stroke="#7A0C06" stroke-width="2"/><path d="M56 48 L40 88 L50 84 L58 90 Z" fill="#C8150A" stroke="#7A0C06" stroke-width="1.5"/><path d="M64 48 L80 88 L70 84 L62 90 Z" fill="#C8150A" stroke="#7A0C06" stroke-width="1.5"/><ellipse cx="60" cy="46" rx="11" ry="10" fill="#E8190A" stroke="#7A0C06" stroke-width="2"/><path d="M22 24 C30 18 42 22 50 34" stroke="#FFB4A0" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/><path d="M98 24 C90 18 78 22 70 34" stroke="#FFB4A0" stroke-width="3" fill="none" opacity=".45" stroke-linecap="round"/></svg>' +
      '<div class="badge"><img src="/images/wingo-logo-wide.png" alt="Wing-O"></div><div class="stamp">' + (c.kind === 'bonus' ? 'BONUS<br>CARD<br>★' : 'HOLIDAY<br>EDITION<br>★') + '</div>' +
      '<div class="face" style="text-align:left;"><div class="amt">' + money(c.initial).replace('.00','') + '</div><div class="lbl">WING-O ' + (c.kind === 'bonus' ? 'BONUS ' : '') + 'GIFT CARD</div><div class="sub">Good at every Wing-O</div></div></div></div>' +
      '<div class="panel"><div class="code">' + esc(c.code) + '</div><div id="qr"></div>' +
      '<div class="bal">Balance: <b>' + money(c.balance) + '</b></div>' + (c.why ? '<div class="err">' + esc(c.why) + '</div>' : '') + '</div>' +
      '<p class="note"><b>In the store:</b> show this screen at the counter.<br><b>Online:</b> enter the code at checkout.<br>Good at every Wing-O in Regina and Winnipeg. ' +
      (c.kind === 'bonus' && c.expiresAt ? 'Bonus card: use by ' + new Date(c.expiresAt).toLocaleDateString('en-CA', { month:'long', day:'numeric', year:'numeric', timeZone:'America/Regina' }) + '.' : 'No expiry, no fees.') + '</p>' +
      '<a class="btn" href="/order?utm_source=giftcard&utm_medium=card">ORDER ONLINE</a>';
    try { new QRCode(document.getElementById('qr'), { text: c.code, width: 440, height: 440, colorDark: '#1A1208', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
    catch(e) { document.getElementById('qr').remove(); }
  })
  .catch(function(e){ document.getElementById('out').innerHTML = '<p class="err">' + esc(e.message || 'Card not found.') + '</p><a class="btn" href="/gift-cards">Wing-O gift cards</a>'; });
</script>
</body>
</html>
