<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wing Rush — The Official WingO Game</title>
<meta name="description" content="Dodge, dash and collect wing flavours through the streets of Regina, SK in Wing Rush — WingO's official endless runner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0D0D0D; --ink:#1A1208; --paper:#F4EBD7;
  --red:#E8190A; --red-deep:#A80F00;
  --yellow:#F5A800; --yellow-deep:#C28200; --gold:#8B6A1A;
  --font-head:'Oswald',sans-serif; --font-display:'Bebas Neue',sans-serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--black);font-family:var(--font-body);}
#app{position:fixed;inset:0;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%, #241a08 0%, #0D0D0D 70%);color:#fff;text-align:center;padding:1.5rem;z-index:10;}
.hidden{display:none !important;}

.logo-wrap{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;}
.logo-wrap img{height:44px;width:auto;border-radius:6px;}
h1.title{font-family:var(--font-display);font-size:clamp(3rem,13vw,5.5rem);letter-spacing:3px;line-height:.9;margin:.2rem 0 0;
  background:linear-gradient(180deg,var(--yellow) 0%, var(--red) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 0 rgba(0,0,0,.35);}
p.subtitle{font-family:var(--font-head);letter-spacing:3px;text-transform:uppercase;font-size:.85rem;color:var(--yellow);margin:.3rem 0 1.6rem;}

.flavor-strip{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;max-width:420px;margin-bottom:1.6rem;}
.flavor-chip{display:flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:.3rem .7rem;font-family:var(--font-head);font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:#ddd;}

.btn{font-family:var(--font-display);font-size:1.3rem;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;
  padding:.85rem 2.6rem;border-radius:6px;transition:transform .12s ease;}
.btn:active{transform:scale(.95);}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-deep);}
.btn-primary:active{box-shadow:0 2px 0 var(--red-deep);}
.btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);margin-top:.7rem;padding:.6rem 1.8rem;font-size:1rem;}

.howto{margin-top:1.6rem;display:flex;gap:1.4rem;font-family:var(--font-head);font-size:.72rem;letter-spacing:1px;color:#999;text-transform:uppercase;}
.howto div{display:flex;flex-direction:column;align-items:center;gap:.3rem;}
.howto span.key{font-size:1.3rem;}

.hi-score{font-family:var(--font-head);letter-spacing:2px;color:#999;font-size:.8rem;text-transform:uppercase;margin-top:1.1rem;}
.hi-score b{color:var(--yellow);font-size:1rem;}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;z-index:5;pointer-events:none;font-family:var(--font-head);}
#score-box{color:#fff;}
#score-box .label{font-size:.6rem;letter-spacing:3px;color:var(--yellow);text-transform:uppercase;opacity:.85;}
#score-box .val{font-family:var(--font-display);font-size:2.1rem;line-height:1;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.6);}
#hearts{display:flex;gap:4px;font-size:1.3rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
#hearts span.lost{opacity:.2;filter:none;}
#boost-banner{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-family:var(--font-display);
  color:var(--yellow);letter-spacing:2px;font-size:1.1rem;text-shadow:0 2px 4px rgba(0,0,0,.7);z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;}
#boost-banner.show{opacity:1;}

/* touch controls */
#touch-controls{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:0 18px calc(16px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;}
#touch-controls .side{display:flex;gap:10px;pointer-events:auto;}
#touch-controls .mid{display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:auto;}
.tbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);user-select:none;}
.tbtn:active{background:rgba(245,168,0,.35);}
@media(min-width:900px){ #touch-controls{display:none;} }

/* game over */
#gameover-screen .go-title{font-family:var(--font-display);font-size:clamp(2.6rem,10vw,4rem);color:var(--red);letter-spacing:2px;margin-bottom:.2rem;}
.stat-row{display:flex;gap:1.6rem;margin:1rem 0 .3rem;flex-wrap:wrap;justify-content:center;}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.8rem 1.3rem;min-width:110px;}
.stat .n{font-family:var(--font-display);font-size:1.9rem;color:var(--yellow);}
.stat .l{font-family:var(--font-head);font-size:.62rem;letter-spacing:2px;color:#999;text-transform:uppercase;margin-top:2px;}
.new-record{font-family:var(--font-head);color:var(--yellow);letter-spacing:2px;font-size:.8rem;text-transform:uppercase;margin:.5rem 0 0;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.order-cta{margin-top:1.4rem;font-family:var(--font-head);font-size:.75rem;color:#aaa;letter-spacing:1px;}
.order-cta a{color:var(--yellow);text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="score-box">
      <div class="label">Score</div>
      <div class="val" id="score-val">0</div>
      <div style="font-size:.58rem;letter-spacing:2px;color:#aaa;text-transform:uppercase;margin-top:2px;">📍 Regina, SK</div>
    </div>
    <div id="hearts"></div>
  </div>
  <div id="boost-banner">🔥 SAUCE BOSS BOOST!</div>

  <div id="touch-controls" class="hidden">
    <div class="side"><div class="tbtn" id="btn-left">◀</div></div>
