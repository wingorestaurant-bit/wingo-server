<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Winnipeg Sign-ups — Wing-O Admin</title>
<link rel="icon" type="image/jpeg" href="/images/logo.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,Arial,sans-serif;background:#0D0D0D;color:#eee;min-height:100vh;padding:1.5rem;}
.wrap{max-width:980px;margin:0 auto;}
header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;}
header img{height:40px;width:auto;}
h1{font-family:Oswald,Arial,sans-serif;font-size:1.3rem;letter-spacing:2px;text-transform:uppercase;color:#F5A800;}
.card{background:#1A1208;border:1px solid #3a2e1c;border-radius:8px;padding:1.25rem;margin-bottom:1rem;}
input{width:100%;max-width:320px;padding:.75rem;border-radius:6px;border:1.5px solid #444;background:#111;color:#fff;font-size:1rem;}
button{background:#E8190A;color:#fff;border:0;border-radius:6px;padding:.75rem 1.2rem;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:.6rem;}
button.alt{background:#F5A800;color:#0D0D0D;}
.stats{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;}
.stat{background:#1A1208;border:1px solid #3a2e1c;border-radius:8px;padding:1rem 1.25rem;min-width:150px;}
.stat b{display:block;font-size:2rem;color:#F5A800;}
.stat span{font-size:.8rem;color:#999;text-transform:uppercase;letter-spacing:1px;}
.tbl{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.9rem;}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid #2a2a2a;white-space:nowrap;}
th{color:#F5A800;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;}
tr.off td{color:#666;text-decoration:line-through;}
.err{color:#FEB2B2;margin-top:.6rem;}
.ok{color:#9AE6B4;margin-top:.6rem;}
#camp h2{font-family:Oswald,Arial,sans-serif;font-size:1.1rem;letter-spacing:1px;color:#F5A800;margin-bottom:.4rem;}
#camp .subj{color:#bbb;margin-bottom:.8rem;font-size:.95rem;}
#camp .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
#camp .row input{max-width:280px;}
#camp .big{font-size:1.05rem;padding:.9rem 1.4rem;}
#camp button:disabled{opacity:.45;cursor:not-allowed;}
#c-prog{margin-top:.8rem;color:#ddd;}
#c-frame{width:100%;max-width:600px;height:640px;border:0;border-radius:8px;background:#fff;margin-top:.8rem;display:none;}
</style>
</head>
<body>
<div class="wrap">
<header><img src="/images/wingo-logo-wide.png" alt="Wing-O"><h1>Winnipeg Sign-ups</h1></header>

<div class="card" id="login">
  <p style="margin-bottom:.6rem;color:#bbb;">Enter the admin password (the <code>ADMIN_PASSWORD</code> set on Railway).</p>
  <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password">
  <br><button id="go">View sign-ups</button>
  <div class="err" id="err"></div>
</div>

<div id="out" style="display:none;">
  <div class="stats">
    <div class="stat"><b id="n-sub">0</b><span>Subscribed</span></div>
    <div class="stat"><b id="n-all">0</b><span>Total sign-ups</span></div>
  </div>
  <div class="card" id="camp">
    <h2>📣 Email your Winnipeg list</h2>
    <p class="subj">Email: <select id="c-pick" style="max-width:340px;padding:.4rem;border-radius:6px;"></select></p>
    <p class="subj">Subject: <b id="c-subj">…</b></p>
    <div class="row">
      <button class="alt" id="c-prev" style="margin-top:0;">👀 Preview</button>
      <input type="email" id="c-test-to" placeholder="Your email for a test">
      <button class="alt" id="c-test" style="margin-top:0;">✉️ Send me a test</button>
    </div>
    <iframe id="c-frame" title="Email preview"></iframe>
    <div style="margin-top:1rem;"><button class="big" id="c-send" disabled>Send to all</button></div>
    <div id="c-prog"></div>
    <div class="err" id="c-err"></div>
  </div>
  <button class="alt" id="csv">⬇ Download CSV (subscribed only)</button>
  <div class="card tbl" style="margin-top:1rem;"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Neighbourhood</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</div>
<script>
(function(){
  var data = null;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function load(){
    var pw = document.getElementById('pw').value, err = document.getElementById('err');
    err.textContent = '';
    fetch('/api/winnipeg/list', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (!res.ok) { err.textContent = res.d.error || 'Could not load.'; return; }
        data = res.d; pwUsed = pw; status();
        document.getElementById('login').style.display = 'none';
        document.getElementById('out').style.display = 'block';
        document.getElementById('n-sub').textContent = data.subscribed;
        document.getElementById('n-all').textContent = data.total;
        document.getElementById('rows').innerHTML = data.rows.map(function(r){
          return '<tr class="' + (r.unsubscribed ? 'off' : '') + '"><td>' + esc(new Date(r.created_at).toLocaleDateString('en-CA')) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.phone) + '</td><td>' + esc(r.area) + '</td></tr>';
        }).join('') || '<tr><td colspan="5" style="color:#888;">No sign-ups yet.</td></tr>';
      })
      .catch(function(){ err.textContent = 'Network error.'; });
  }
  // ── emails to the list ──
  var pwUsed = '', poll = null, camp = '';
  function api(path, body){
    body = body || {}; body.password = pwUsed; if (camp) body.campaign = camp;
    return fetch('/api/winnipeg/campaign/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Something went wrong.'); return d; }); });
  }
  function cErr(m){ document.getElementById('c-err').textContent = m || ''; }
  function status(){
    return api('status').then(function(d){
      document.getElementById('c-subj').textContent = d.subject;
      camp = d.campaign;
      var pick = document.getElementById('c-pick');
      if (!pick.options.length) d.campaigns.forEach(function(c){ var o = document.createElement('option'); o.value = c.id; o.textContent = c.label; pick.appendChild(o); });
      pick.value = d.campaign;
      var btn = document.getElementById('c-send'), prog = document.getElementById('c-prog');
      var lines = ['✅ Sent: <b>' + d.sent + '</b> &nbsp; ⏳ Not sent yet: <b>' + d.pending + '</b>' + (d.failed ? ' &nbsp; ⚠️ Failed: <b>' + d.failed + '</b> (press Send again to retry them)' : '')];
      if (d.running) lines.push('Sending now… keep this page open to watch, or close it. It keeps going either way.');
      else if (d.last && d.last.finished && d.last.error) lines.push('Last send stopped: ' + esc(d.last.error));
      if (!d.emailReady) lines.push('⚠️ Email is not set up: add RESEND_API_KEY on Railway.');
      prog.innerHTML = lines.join('<br>');
      if (d.running && d.runningCampaign && d.runningCampaign !== d.campaign) lines.push('Another email is sending right now. Wait for it to finish.');
      btn.disabled = d.running || !d.pending || !d.emailReady;
      btn.textContent = d.running ? 'Sending…' : d.pending ? '🚀 Send to all ' + d.pending + ' subscribed' : (d.sent ? '✅ Everyone has it' : 'No one to send to');
      if (d.running && !poll) poll = setInterval(status, 3000);
      if (!d.running && poll) { clearInterval(poll); poll = null; }
    }).catch(function(e){ cErr(e.message); });
  }
  document.getElementById('c-pick').addEventListener('change', function(){
    camp = this.value; cErr('');
    document.getElementById('c-frame').style.display = 'none';
    status();
  });
  document.getElementById('c-prev').addEventListener('click', function(){
    cErr('');
    api('preview').then(function(d){ var f = document.getElementById('c-frame'); f.srcdoc = d.html; f.style.display = 'block'; }).catch(function(e){ cErr(e.message); });
  });
  document.getElementById('c-test').addEventListener('click', function(){
    var to = document.getElementById('c-test-to').value.trim(), b = this;
    cErr(''); b.disabled = true;
    api('test', { email: to }).then(function(){ document.getElementById('c-prog').insertAdjacentHTML('afterbegin', '<div class="ok">Test sent to ' + esc(to) + '. Check your inbox (and spam).</div>'); })
      .catch(function(e){ cErr(e.message); }).then(function(){ b.disabled = false; });
  });
  document.getElementById('c-send').addEventListener('click', function(){
    var n = (this.textContent.match(/\d+/) || ['0'])[0];
    var pk = document.getElementById('c-pick'); if (!confirm('Send "' + pk.options[pk.selectedIndex].text + '" to ' + n + ' people now?\n\nThis cannot be undone. Each person only gets it once.')) return;
    cErr(''); this.disabled = true;
    api('send', { confirm: 'SEND' }).then(function(){ return status(); }).then(function(){ if (!poll) poll = setInterval(status, 3000); })
      .catch(function(e){ cErr(e.message); status(); });
  });

  document.getElementById('go').addEventListener('click', load);
  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
  document.getElementById('csv').addEventListener('click', function(){
    if (!data) return;
    var q = function(v){ v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    var lines = [['Date', 'Name', 'Email', 'Phone', 'Neighbourhood'].join(',')].concat(
      data.rows.filter(function(r){ return !r.unsubscribed; }).map(function(r){
        return [new Date(r.created_at).toISOString().slice(0, 10), r.name, r.email, r.phone, r.area].map(q).join(',');
      }));
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'wingo-winnipeg-signups.csv';
    a.click();
  });
})();
</script>
</body>
</html>
